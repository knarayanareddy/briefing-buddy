name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Syntax/lint gate: parses every edge function & test file. The excluded
      # rules are pre-existing codebase-wide style patterns (https-import
      # prefixes, `any`s) tracked separately; everything else must pass.
      - name: Edge function lint (syntax gate)
        run: >-
          deno lint
          --rules-exclude=no-explicit-any,no-import-prefix,no-unused-vars,require-await
          supabase/functions tests

      # Unit tests only: import-mapped to local/npm specifiers (tests/import_map.json)
      # so no deno.land/esm.sh access is needed. Integration tests
      # (tests/milestone_*) require SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
      # and run separately.
      - name: Edge function unit tests (Deno)
        run: npm run test:deno
